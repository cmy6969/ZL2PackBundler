name: build

# 仅手动触发（Actions 页面 Run workflow）；不随 push/tag 自动构建，也不自动创建 Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (仅需 build-tools：zipalign/aapt2/apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Build portable runtime (JRE + signing tools)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-bundled-runtime.ps1 `
            -BuildTools "$env:ANDROID_HOME\build-tools\36.0.0" `
            -JdkHome "$env:JAVA_HOME"

      - name: Test
        run: dotnet test ZL2PackBundler.sln -c Release

      - name: Publish GUI (single-file)
        run: dotnet publish src/ZL2PackBundler.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-x64

      - name: Publish CLI (single-file)
        run: dotnet publish src/ZL2PackBundler.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-x64

      # 产物只作为构建运行附件（run 的 Artifacts 下载），不发布到 Releases
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZL2PackBundler-win-x64
          path: |
            publish/win-x64/ZL2PackBundler.App.exe
            publish/win-x64/zl2packbundler.exe
